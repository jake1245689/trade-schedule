services:
  - type: web
    name: ai-landscape-render
    env: node
    plan: free
    rootDir: ai-landscape-render
    buildCommand: cd client && npm install && npm run build && cd ../server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
